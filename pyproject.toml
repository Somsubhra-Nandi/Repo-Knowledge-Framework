[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graphrag-mcp"
version = "0.1.0"
description = "Polyglot GraphRAG MCP server scaffold"
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Core Developer Team" }
]

[project.optional-dependencies]
core = [
  "tree-sitter>=0.23.0",
  "tree-sitter-python>=0.23.0",
  "tree-sitter-typescript>=0.23.0",
  "tree-sitter-javascript>=0.23.0",
  "tree-sitter-java>=0.23.0",
  "tree-sitter-go>=0.23.0",
  "tree-sitter-rust>=0.23.0",
  "tree-sitter-ruby>=0.23.0",
  "tree-sitter-php>=0.23.0",
  "tree-sitter-swift>=0.0.1",
  "tree-sitter-kotlin>=0.23.0",
  "tree-sitter-bash>=0.23.0",
  "tree-sitter-sql>=0.3.11",
  "tree-sitter-html>=0.23.0",
  "tree-sitter-css>=0.23.0",
  "tree-sitter-c>=0.23.0",
  "tree-sitter-cpp>=0.23.0",
  "mcp[cli]>=1.0.0",
  "neo4j",
  "pydantic>=2",
  "pydantic-settings>=2.3.0",
  "python-dotenv>=1.0.0",
  "fastapi",
  "uvicorn[standard]",
  "httpx>=0.27.0"
]
dev = [
  "ruff"
]
test = [
  "pytest"
]

[project.scripts]
graphrag = "graphrag.cli:main"
graphrag-mcp = "graphrag.mcp.server:serve"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["graphrag*"]

[tool.ruff]
line-length = 100
target-version = "py312"
